spring:
  application:
    name: clinica-fisioterapia

  datasource:
    url: jdbc:postgresql://localhost:5432/clinica_fisioterapia_dev
    username: postgres
    password: password  # ⚠️ Contraseña de tu postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # Cambiado a 'update' para que Hibernate cree las columnas faltantes
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    user:
      name: admin
      password: admin123

server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437  # Clave secreta 256-bit
  expiration: 86400000  # 24 horas en milisegundos

logging:
  level:
    com.clinica.fisioterapia: DEBUG
    org.springframework.security: DEBUG

# TPV Integration Configuration
tpv:
  base-url: https://tpv-backend-cbbg.onrender.com
  merchant-id: CLINICA_FISIO_001
  api-key: ${TPV_API_KEY:YOUR_API_KEY_HERE}
  api-secret: ${TPV_API_SECRET:YOUR_API_SECRET_HERE}
  callback-url: http://localhost:8080/api/pagos/callback
  success-url: http://localhost:5173/cliente/pago-exitoso
  error-url: http://localhost:5173/cliente/pago-error
  enabled: true
  mock-mode: true  # Cambiar a false en producción