spring:
  application:
    name: clinica-fisioterapia

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clinica_fisioterapia_dev}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  expiration: 86400000

logging:
  level:
    com.clinica.fisioterapia: ${LOG_LEVEL:INFO}
    org.springframework.security: ${LOG_LEVEL:INFO}

# TPV Integration Configuration
tpv:
  base-url: https://tpv-backend-cbbg.onrender.com
  merchant-id: CLINICA_FISIO_001
  api-key: ${TPV_API_KEY:sk_fa4f4210-5a97-41d5-85db-b704a8763d53}
  api-secret: ${TPV_API_SECRET:YOUR_API_SECRET_HERE}
  callback-url: ${BACKEND_URL:http://localhost:8080}/api/pagos/callback
  success-url: ${FRONTEND_URL:http://localhost:5173}/cliente/pago-exitoso
  error-url: ${FRONTEND_URL:http://localhost:5173}/cliente/pago-error
  enabled: true
  mock-mode: ${TPV_MOCK_MODE:false}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
